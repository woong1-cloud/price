name: Auto Push Zigzag & Naver Data

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 자동 실행 (더 자주 갱신)
  workflow_dispatch:           # GitHub 웹에서 수동 실행 버튼도 제공
  push:
    branches: [ main ]         # 코드 배포(push) 시 자동으로 데이터도 재push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Push Zigzag data
        env:
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: python push_local.py zigzag

      - name: Push Naver data
        env:
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: python push_local.py naver
