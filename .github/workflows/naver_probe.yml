name: Naver Block Probe (진단)

# 네이버 브랜드스토어 차단 유형을 GitHub Actions(Azure IP) 기준으로 진단.
# 수동 실행 전용 — Actions 탭에서 "Run workflow" 버튼으로 돌린 뒤 로그 확인.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Show runner public IP
        run: |
          echo "=== Runner 공인 IP (차단 대상 IP) ==="
          curl -s https://api.ipify.org || echo "(IP 조회 실패)"
          echo ""

      - name: Run Naver block probe (urllib + Playwright 비교)
        run: python naver_probe.py
